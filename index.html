<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taktisk Planerare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.6/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- STARTSIDA -->
  <div id="start-screen" class="screen active">
    <header class="start-header">
      <div class="logo-area">
        <div class="logo-icon">ER</div>
        <div>
          <h1>MALMÖ SKÅNE SWEDEN TAKTISK PLANERARE</h1>
          <p class="subtitle">Operativt planeringssystem för Roblox RP</p>
        </div>
      </div>

      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <button id="btn-login" class="btn btn-secondary btn-sm">Logga in</button>
        <div id="user-info" class="hidden" style="display: flex; align-items: center; gap: 10px;">
          <span id="user-email" style="font-size: 13px; color: #94a3b8;"></span>
          <button id="btn-logout" class="btn btn-secondary btn-sm">Logga ut</button>
        </div>
      </div>
    </header>

    <main class="start-main">
      <div class="action-buttons">
        <button id="btn-new-op" class="btn btn-primary btn-large">
          <span class="btn-icon">+</span>
          NY OPERATION
        </button>
        <button id="btn-open-op" class="btn btn-secondary btn-large">
          <span class="btn-icon">📂</span>
          ÖPPNA OPERATION
        </button>
      </div>

      <section class="saved-ops-section">
        <h2>Sparade operationer</h2>
        <div id="saved-ops-list" class="saved-ops-grid"></div>
        <p id="no-ops-msg" class="no-ops">Inga sparade operationer ännu. Skapa en ny för att komma igång.</p>
      </section>
    </main>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2 id="auth-title">Logga in</h2>
        <button class="modal-close" data-close="auth-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>E-post</label>
          <input type="email" id="auth-email" placeholder="namn@email.com">
        </div>
        <div class="form-group">
          <label>Lösenord</label>
          <input type="password" id="auth-password" placeholder="Minst 6 tecken">
        </div>
        <p id="auth-error" style="color:#ef4444; font-size:13px; display:none; margin-top:8px;"></p>
        <p style="margin-top:14px; font-size:13px; color:#94a3b8;">
          <span id="auth-switch-text">Har du inget konto?</span>
          <a href="#" id="auth-toggle" style="color:#60a5fa;">Skapa konto</a>
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close="auth-modal">Avbryt</button>
        <button class="btn btn-primary" id="btn-auth-submit">Logga in</button>
      </div>
    </div>
  </div>

  <!-- NY OPERATION MODAL -->
  <div id="new-op-modal" class="modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h2>Skapa ny operation</h2>
        <button class="modal-close" data-close="new-op-modal">&times;</button>
      </div>
      <form id="new-op-form" class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label for="op-name">Operationsnamn *</label>
            <input type="text" id="op-name" required placeholder="t.ex. Operation Nightfall">
          </div>
          <div class="form-group">
            <label for="op-number">Operationsnummer</label>
            <input type="text" id="op-number" placeholder="t.ex. OP-2026-001">
          </div>
          <div class="form-group">
            <label for="op-date">Datum</label>
            <input type="date" id="op-date">
          </div>
          <div class="form-group">
            <label for="op-location">Plats</label>
            <input type="text" id="op-location" placeholder="t.ex. Liberty County">
          </div>
          <div class="form-group">
            <label for="op-commander">Insatschef</label>
            <input type="text" id="op-commander" placeholder="Namn">
          </div>
          <div class="form-group">
            <label for="op-leader">Insatsledare</label>
            <input type="text" id="op-leader" placeholder="Namn">
          </div>
          <div class="form-group">
            <label for="op-status">Status</label>
            <select id="op-status">
              <option value="PLANERING">PLANERING</option>
              <option value="REDO">REDO</option>
              <option value="AKTIV">AKTIV</option>
              <option value="AVSLUTAD">AVSLUTAD</option>
              <option value="AVBRUTEN">AVBRUTEN</option>
            </select>
          </div>
          <div class="form-group">
            <label for="op-priority">Prioritet</label>
            <select id="op-priority">
              <option value="LÅG">LÅG</option>
              <option value="NORMAL" selected>NORMAL</option>
              <option value="HÖG">HÖG</option>
              <option value="AKUT">AKUT</option>
            </select>
          </div>
          <div class="form-group">
            <label for="op-threat">Hotnivå</label>
            <select id="op-threat">
              <option value="LÅG">LÅG</option>
              <option value="MEDEL">MEDEL</option>
              <option value="HÖG">HÖG</option>
              <option value="KRITISK">KRITISK</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="op-objective">Huvudmål</label>
            <input type="text" id="op-objective" placeholder="t.ex. Högriskgripande">
          </div>
          <div class="form-group full-width">
            <label for="op-notes">Anteckningar</label>
            <textarea id="op-notes" rows="3" placeholder="Kort beskrivning..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close="new-op-modal">Avbryt</button>
          <button type="submit" class="btn btn-primary">Skapa operation</button>
        </div>
      </form>
    </div>
  </div>

  <!-- HUVUDAPP -->
  <div id="app-screen" class="screen">
    <header class="app-header">
      <div class="header-left">
        <button id="btn-back-home" class="btn btn-icon" title="Tillbaka till startsida">←</button>
        <div class="op-info">
          <h1 id="header-op-name">Operation</h1>
          <span id="header-op-meta" class="op-meta"></span>
        </div>
      </div>
      <div class="header-center">
        <div class="toolbar-group">
          <button id="btn-undo" class="btn btn-tool" title="Ångra (Ctrl+Z)">↶</button>
          <button id="btn-redo" class="btn btn-tool" title="Gör om (Ctrl+Y)">↷</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-zoom-in" class="btn btn-tool" title="Zooma in">+</button>
          <button id="btn-zoom-out" class="btn btn-tool" title="Zooma ut">−</button>
          <button id="btn-zoom-fit" class="btn btn-tool" title="Anpassa till skärm">⊡</button>
          <button id="btn-zoom-reset" class="btn btn-tool" title="100%">1:1</button>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-save" class="btn btn-primary btn-sm">SPARA</button>
        <button id="btn-export-menu" class="btn btn-secondary btn-sm">EXPORTERA ▾</button>
        <div id="export-dropdown" class="dropdown-menu hidden">
          <button data-export="png">Exportera PNG</button>
          <button data-export="jpg">Exportera JPG</button>
          <button data-export="erlcplan">Exportera .erlcplan</button>
          <button data-import="erlcplan">Importera .erlcplan</button>
        </div>
        <input type="file" id="import-file" accept=".erlcplan,.json" class="hidden">
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar sidebar-left">
        <!-- Keep your existing left sidebar (tools + symbols) exactly as before -->
        <div class="panel">
          <h3 class="panel-title">Verktyg</h3>
          <div class="tool-grid" id="tool-grid">
            <!-- your tool buttons -->
          </div>
        </div>
        <!-- ... rest of your left sidebar ... -->
      </aside>

      <main class="map-area">
        <div id="map-toolbar" class="map-toolbar">
          <button id="btn-upload-map" class="btn btn-primary btn-sm">LADDA UPP KARTA</button>
          <button id="btn-change-map" class="btn btn-secondary btn-sm hidden">BYT KARTA</button>
          <button id="btn-lock-map" class="btn btn-secondary btn-sm">🔒 Lås karta</button>
          <input type="file" id="map-upload" accept="image/png,image/jpeg,image/jpg,image/webp" class="hidden">
          <span id="map-status" class="map-status">Ingen karta uppladdad</span>
        </div>
        <div id="stage-container">
          <div id="konva-container"></div>
        </div>
        <div id="coords-display" class="coords-display">x: 0, y: 0 | Zoom: 100%</div>
      </main>

      <aside class="sidebar sidebar-right">
        <!-- Keep your existing right sidebar -->
      </aside>
    </div>
  </div>

  <!-- Keep all your other modals (edit-object, group, timeline, confirm) -->

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
